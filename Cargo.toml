[workspace]
resolver = "2"
members = ["vendor/innertube", "crates/player"]
[workspace.package]
version = "0.5.7"
edition = "2021"
license = "GPL-3.0-or-later"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tracing = "0.1"
thiserror = "2"
[package]
name = "ambramusic"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "AmbraMusic: client YouTube Music per Windows con GUI Slint (derivato da Limusic)"
[[bin]]
name = "AmbraMusic"
path = "src/main.rs"
[dependencies]
# FemtoVG (OpenGL) come renderer principale: niente difetti di trasparenza/ridisegno del renderer
# software. Se OpenGL non è disponibile, Slint passa da solo al renderer software.
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "system-tray", "compat-1-2", "raw-window-handle-06"] }
innertube = { path = "vendor/innertube" }
player = { path = "crates/player" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow = "1"
directories = "6"
discord-rich-presence = "1.1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rand = "0.8"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Finestra di accesso Google (WebView2), solo Windows. Versioni allineate: wry 0.56 usa tao 0.36.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
wry = { version = "0.56", default-features = false, features = ["os-webview"] }
tao = { version = "0.36", default-features = false, features = ["rwh_06"] }
[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
