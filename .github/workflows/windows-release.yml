# Build Windows x64: eseguibile release, installer personalizzato, versione portabile e verifica
# isolata dell'installer. Usa gli stessi script della compilazione locale.
name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['fix/**', 'release/**']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust MSVC
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-cache
          key: win-${{ hashFiles('Cargo.lock') }}
          restore-keys: win-

      - name: Build app e installer
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -CacheDir "$env:GITHUB_WORKSPACE\build-cache"

      - name: Log di compilazione
        if: always()
        shell: pwsh
        run: if (Test-Path COMPILAZIONE.log) { Get-Content COMPILAZIONE.log -Tail 80 }

      - name: Verifica isolata dell'installer
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $setup = "dist\AmbraMusic-Setup-$v-x64.exe"
          $report = Join-Path $env:RUNNER_TEMP 'selftest\report.txt'
          New-Item -ItemType Directory -Force (Split-Path $report) | Out-Null
          $p = Start-Process -FilePath $setup -ArgumentList '--self-test', $report -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Self-test fallito ($($p.ExitCode))" }

      - name: Pacchetti portabile e checksum
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $src = "dist\AmbraMusic-$v"
          $port = "dist\portable\AmbraMusic-$v"
          New-Item -ItemType Directory -Force $port | Out-Null
          Copy-Item "$src\*" $port -Recurse -Force
          # Il disinstallatore serve solo alla copia installata.
          Remove-Item "$port\Uninstall.exe" -ErrorAction SilentlyContinue
          $zip = "dist\AmbraMusic-$v-portable-x64.zip"
          Compress-Archive -Path $port -DestinationPath $zip -Force
          $files = @("dist\AmbraMusic-Setup-$v-x64.exe", $zip)
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path $_ -Leaf) } |
            Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: AmbraMusic-${{ env.VERSION }}-windows-x64
          path: |
            dist/AmbraMusic-Setup-*-x64.exe
            dist/AmbraMusic-*-portable-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
